<nav
    class="hidden items-center rounded-2xl border border-white/10 bg-white/5 p-2 backdrop-blur-xl lg:flex">

    @for (link of navLinks; track link.path) {

    <a

        [routerLink]="link.path"

        routerLinkActive="bg-gradient-to-r from-orange-500 to-blue-600 text-white shadow-lg shadow-orange-500/20"

        [routerLinkActiveOptions]="{ exact: link.exact }"

        class="group relative overflow-hidden rounded-xl px-5 py-2.5 text-sm font-semibold tracking-wide text-slate-300 transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/10 hover:text-white">

        <!-- Hover Glow -->

        <span
            class="absolute inset-0 opacity-0 transition duration-300 group-hover:opacity-100">

            <span
                class="absolute inset-x-4 top-0 h-px bg-linear-to-r from-transparent via-orange-400/70 to-transparent">

            </span>

        </span>

        <!-- Text -->

        <span class="relative z-10">

            {{ link.label }}

        </span>

    </a>

    }

</nav>
