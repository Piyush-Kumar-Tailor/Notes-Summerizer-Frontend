<div
    class="relative min-h-screen overflow-hidden bg-linear-to-br from-orange-50 via-white to-blue-50">

    <!-- Background Blur -->

    <div
        class="absolute -left-40 -top-40 h-96 w-96 rounded-full bg-orange-300/30 blur-3xl">
    </div>

    <div
        class="absolute -bottom-40 -right-40 h-96 w-96 rounded-full bg-blue-300/30 blur-3xl">
    </div>

    <!-- Content -->

    <div
        class="relative z-10 flex min-h-screen items-center justify-center px-6">

        <div
            class="w-full max-w-lg rounded-3xl border border-slate-200 bg-white p-10 shadow-2xl">

            <!-- Logo -->

            <div class="text-center">

                <div
                    class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-linear-to-br from-orange-500 to-blue-600 text-3xl text-white">

                    🔐

                </div>

                <h1
                    class="mt-6 text-3xl font-bold text-slate-900">

                    Verify Your Email

                </h1>

                <p
                    class="mt-3 text-slate-500">

                    Enter the 6-digit OTP sent to

                </p>

                <p
                    class="mt-1 font-semibold text-orange-600">

                    {{ email() }}

                </p>

            </div>

            <!-- Form -->

            <form

                class="mt-10"

                [formGroup]="otpForm"

                (ngSubmit)="verifyOtp()">

                <!-- OTP Inputs -->

                <div
                    class="flex justify-center gap-3">

                    @for (control of otpControls; track $index) {

                    <input

                        #otpInput

                        type="text"

                        maxlength="1"

                        inputmode="numeric"

                        pattern="[0-9]*"

                        autocomplete="one-time-code"

                        [formControl]="control"

                        (input)="moveNext($event, $index)"

                        (keydown)="movePrevious($event, $index)"

                        (paste)="onPaste($event)"

                        class="h-16 w-16 rounded-xl border border-slate-300 bg-slate-50 text-center text-2xl font-bold outline-none transition duration-200 focus:border-orange-500 focus:ring-4 focus:ring-orange-100"

                        [class.border-red-500]="control.invalid && control.touched" />

                    }

                </div>

                <!-- Validation -->

                @if (otpForm.invalid && otpForm.touched) {

                <p
                    class="mt-4 text-center text-sm text-red-600">

                    Please enter all 6 digits.

                </p>

                }

                <!-- Verify Button -->

                <button

                    type="submit"

                    [disabled]="loading()"

                    class="mt-10 flex w-full items-center justify-center rounded-xl bg-linear-to-r from-orange-500 to-blue-600 py-3 font-semibold text-white shadow-lg transition duration-300 hover:scale-[1.02] disabled:cursor-not-allowed disabled:opacity-60">

                    @if (!loading()) {

                    Verify OTP

                    }

                    @else {

                    <svg
                        class="mr-2 h-5 w-5 animate-spin"
                        fill="none"
                        viewBox="0 0 24 24">

                        <circle
                            class="opacity-25"
                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            stroke-width="4">
                        </circle>

                        <path
                            class="opacity-75"
                            fill="currentColor"
                            d="M4 12a8 8 0 018-8v4l3-3-3-3v4A10 10 0 002 12h2z">
                        </path>

                    </svg>

                    Verifying...

                    }

                </button>

            </form>

            <!-- Resend -->

            <div
                class="mt-8 text-center">

                <p
                    class="text-slate-500">

                    Didn't receive the OTP?

                </p>

                <button

                    type="button"

                    (click)="resendOtp()"

                    class="mt-2 font-semibold text-orange-600 transition hover:text-blue-600">

                    Resend OTP

                </button>

            </div>

        </div>

    </div>

</div>
