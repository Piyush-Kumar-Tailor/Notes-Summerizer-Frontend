<section class="relative overflow-hidden py-10 sm:py-14 lg:py-18">

    <!-- Background -->

    <div class="absolute inset-0">

        <div
            class="absolute inset-0 bg-linear-to-b from-white via-orange-50/30 to-slate-50">
        </div>

        <div
            class="absolute left-1/2 top-0 h-72 w-72 -translate-x-1/2 rounded-full bg-orange-400/10 blur-[140px]">
        </div>

        <div
            class="absolute right-0 bottom-0 h-72 w-72 rounded-full bg-blue-300/10 blur-[150px]">
        </div>

    </div>

    <div class="relative mx-auto max-w-7xl px-5 sm:px-6 lg:px-8">

        <!-- Header -->

        <div class="mx-auto max-w-3xl text-center">

            <span
                class="inline-flex items-center rounded-full border border-orange-200 bg-white px-4 py-2 text-xs font-semibold tracking-wide text-orange-600 shadow-sm sm:text-sm">

                ✨ Trusted Worldwide

            </span>

            <h2
                class="mt-5 text-3xl font-black tracking-tight text-slate-900 sm:text-4xl lg:text-5xl">

                Trusted by Students &
                <span
                    class="bg-linear-to-r from-orange-500 to-blue-600 bg-clip-text text-transparent">

                    Professionals

                </span>

            </h2>

            <p
                class="mx-auto mt-5 max-w-2xl text-sm leading-7 text-slate-600 sm:text-lg">

                Transform lengthy PDFs into concise AI summaries,
                flashcards, quizzes and interview-ready notes in seconds.

            </p>

        </div>

        <!-- Cards -->

        <div
            class="mt-10 grid gap-5 sm:grid-cols-2 lg:mt-14 lg:grid-cols-4 lg:gap-6">

            @for(stat of stats; track stat.title){

            <div
                class="group relative overflow-hidden rounded-3xl border border-slate-200/70 bg-white/85 p-6 shadow-[0_10px_40px_rgba(15,23,42,.06)] backdrop-blur-xl transition-all duration-500 hover:-translate-y-2 hover:border-orange-200 hover:shadow-[0_20px_60px_rgba(249,115,22,.12)]">

                <!-- Hover Glow -->

                <div
                    class="absolute -right-12 -top-12 h-32 w-32 rounded-full bg-orange-400/10 blur-3xl opacity-0 transition duration-500 group-hover:opacity-100">
                </div>

                <!-- Icon -->

                <div
                    class="relative flex h-14 w-14 items-center justify-center rounded-2xl bg-linear-to-br from-orange-500 to-blue-600 text-2xl text-white shadow-lg transition duration-500 group-hover:scale-110 group-hover:rotate-6">

                    {{ stat.icon }}

                </div>

                <!-- Number -->

                <h3
                    class="relative mt-6 text-3xl font-black tracking-tight text-slate-900 lg:text-4xl">

                    {{ stat.value }}

                </h3>

                <!-- Title -->

                <h4
                    class="mt-2 text-lg font-bold text-slate-800">

                    {{ stat.title }}

                </h4>

                <!-- Description -->

                <p
                    class="mt-3 text-sm leading-6 text-slate-600">

                    {{ stat.description }}

                </p>

            </div>

            }

        </div>

    </div>

</section>
