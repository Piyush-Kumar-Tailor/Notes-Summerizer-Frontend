@if(successMessage()){

<div class="mb-4 rounded-lg bg-green-100 border border-green-300 p-4 text-green-700">

    {{ successMessage() }}

</div>

}

@if(errorMessage()){

<div class="mb-4 rounded-lg bg-red-100 border border-red-300 p-4 text-red-700">

    {{ errorMessage() }}

</div>

}
<div class="min-h-screen bg-slate-50 py-10">

    <div class="mx-auto max-w-2xl px-6">

        <!-- Heading -->

        <div class="mb-8">

            <h1 class="text-3xl font-bold text-slate-900">

                Change Password

            </h1>

            <p class="mt-2 text-slate-600">

                Update your account password to keep your account secure.

            </p>

        </div>

        <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()"
            class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">

            <!-- Current Password -->

            <div class="mb-6">

                <label class="mb-2 block text-sm font-medium text-slate-700">

                    Current Password

                </label>

                <div class="relative">

                    <input [type]="showCurrentPassword ? 'text' : 'password'" formControlName="currentPassword"
                        placeholder="Enter current password"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-12 outline-none transition focus:border-orange-500">

                    <button type="button" (click)="toggleCurrentPassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500">

                        {{ showCurrentPassword ? '🙈' : '👁️' }}

                    </button>

                </div>

            </div>

            <!-- New Password -->

            <div class="mb-6">

                <label class="mb-2 block text-sm font-medium text-slate-700">

                    New Password

                </label>

                <div class="relative">

                    <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword"
                        placeholder="Enter new password"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-12 outline-none transition focus:border-orange-500">

                    <button type="button" (click)="toggleNewPassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500">

                        {{ showNewPassword ? '🙈' : '👁️' }}

                    </button>

                </div>

            </div>

            <!-- Confirm Password -->

            <div class="mb-8">

                <label class="mb-2 block text-sm font-medium text-slate-700">

                    Confirm New Password

                </label>

                <div class="relative">

                    <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword"
                        placeholder="Confirm new password"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-12 outline-none transition focus:border-orange-500">

                    <button type="button" (click)="toggleConfirmPassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500">

                        {{ showConfirmPassword ? '🙈' : '👁️' }}

                    </button>

                </div>

            </div>

            <!-- Buttons -->

            <div class="flex justify-end gap-4">

                <button type="button" routerLink="/profile"
                    class="rounded-xl border border-slate-300 px-6 py-3 font-medium text-slate-700 transition hover:bg-slate-100">

                    Cancel

                </button>

                <button type="submit" [disabled]="changePasswordForm.invalid || loading()"
                    class="rounded-xl bg-linear-to-r from-orange-500 to-blue-600 px-6 py-3 font-semibold text-white shadow-lg transition hover:scale-105 disabled:cursor-not-allowed disabled:opacity-50">

                    @if (!loading()) {

                    Change Password

                    } @else {

                    Updating...

                    }

                </button>

            </div>

        </form>

    </div>

</div>
