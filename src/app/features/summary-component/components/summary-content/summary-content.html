<section id="summary-content"
    class="relative mt-10 overflow-hidden rounded-4xl border border-white/50 bg-white/80 p-6 shadow-[0_25px_60px_rgba(15,23,42,.08)] backdrop-blur-xl sm:p-8">

    <!-- Background Glow -->

    <div class="pointer-events-none absolute inset-0 overflow-hidden">

        <div
            class="absolute -top-20 -right-20 h-60 w-60 rounded-full bg-orange-300/20 blur-[140px]">
        </div>

        <div
            class="absolute -bottom-20 -left-20 h-56 w-56 rounded-full bg-blue-300/15 blur-[140px]">
        </div>

    </div>

    <!-- Header -->

    <div
        class="relative z-10 flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">

        <div>

            <span
                class="inline-flex items-center gap-2 rounded-full border border-orange-200 bg-orange-100 px-5 py-2 text-sm font-semibold text-orange-700">

                🤖 AI Generated

            </span>

            <h2
                class="mt-5 text-3xl font-black text-slate-900 sm:text-4xl">

                AI Summary

            </h2>

            <p
                class="mt-3 flex flex-wrap items-center gap-3 text-slate-600">

                <span
                    class="rounded-full bg-slate-100 px-4 py-2 text-sm font-medium">

                    📖 {{ readingTime() }} min read

                </span>

                <span
                    class="rounded-full bg-blue-100 px-4 py-2 text-sm font-medium text-blue-700">

                    Smart Summary

                </span>

            </p>

        </div>

        <!-- Copy Button -->

        <button

            (click)="copySummary()"

            class="group inline-flex items-center justify-center gap-3 rounded-2xl bg-linear-to-r from-orange-500 to-blue-600 px-6 py-4 font-semibold text-white shadow-xl transition-all duration-300 hover:-translate-y-1 hover:shadow-orange-300/40">

            📋

            Copy Summary

        </button>

    </div>

    <!-- Divider -->

    <div
        class="relative z-10 my-8 border-b border-slate-200">
    </div>

    <!-- Summary Card -->

    <div
        class="relative z-10 overflow-hidden rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">

        <!-- Top Accent -->

        <div
            class="absolute left-0 top-0 h-1 w-full bg-linear-to-r from-orange-500 via-orange-400 to-blue-600">
        </div>

        <article
            class="prose prose-slate max-w-none whitespace-pre-line text-base leading-8 text-slate-700 sm:text-lg">

            {{ displaySummary() }}

        </article>

    </div>

    <!-- Read More -->

    @if(summary!.length > maxCharacters){

    <div
        class="relative z-10 mt-8 flex justify-center">

        <button

            (click)="toggleSummary()"

            class="group inline-flex items-center gap-3 rounded-full border border-orange-200 bg-orange-50 px-6 py-3 font-semibold text-orange-600 transition-all duration-300 hover:bg-orange-500 hover:text-white">

            {{ expanded() ? 'Show Less' : 'Read More' }}

            <span
                class="transition-transform duration-300 group-hover:translate-x-1">

                {{ expanded() ? '↑' : '↓' }}

            </span>

        </button>

    </div>

    }

</section>
