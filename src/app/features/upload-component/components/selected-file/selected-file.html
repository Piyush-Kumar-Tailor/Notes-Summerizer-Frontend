@if (file) {

<div
    class="mx-auto mt-10 max-w-4xl rounded-3xl border border-slate-200 bg-white p-8 shadow-lg">

    <div
        class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">

        <!-- File Details -->

        <div class="flex items-center gap-5">

            <div
                class="flex h-16 w-16 items-center justify-center rounded-2xl bg-linear-to-r from-orange-500 to-blue-600 text-3xl text-white">

                📄

            </div>

            <div>

                <h3 class="text-xl font-bold text-slate-900">

                    {{ file.name }}

                </h3>

                <p class="mt-2 text-slate-600">

                    {{ fileSize }}

                </p>

                <p class="mt-1 font-medium text-green-600">

                    ✓ Valid PDF File

                </p>

            </div>

        </div>

        <!-- Actions -->

        <div class="flex flex-wrap gap-4">

            <button

                (click)="remove.emit()"

                [disabled]="uploading"

                class="rounded-xl border border-red-300 px-6 py-3 font-semibold text-red-600 transition hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-50">

                Remove

            </button>

            <button

                (click)="upload.emit()"

                [disabled]="uploading"

                class="rounded-xl bg-linear-to-r from-orange-500 to-blue-600 px-8 py-3 font-semibold text-white shadow-lg transition hover:-translate-y-1 disabled:cursor-not-allowed disabled:opacity-50">

                @if (!uploading) {

                    Upload PDF

                }

                @else {

                    Uploading...

                }

            </button>

        </div>

    </div>

</div>

}
